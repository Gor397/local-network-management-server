[project]
name = "suro-control"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.121,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1",
  "cryptography>=44", "argon2-cffi>=23", "pyotp>=2.9,<3",
  "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20", "asyncssh>=2.19,<3"
]
[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.25"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
