limit_req_zone $binary_remote_addr zone=api_limit:1m rate=20r/s;
server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:1m;
    ssl_session_timeout 10m;
    server_tokens off;
    client_max_body_size 5m;
    keepalive_timeout 30;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    root /usr/share/nginx/html;
    location /healthz { access_log off; default_type text/plain; return 200 'ok'; }
    location /api/ {
        limit_req zone=api_limit burst=80 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600;
        # No forwarded address is trusted by the application; only this proxy reaches it.
        proxy_set_header X-Suro-Client-Ip "";
    }
    location ~ ^/api/v1/ssh/sessions/.*/terminal$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1900;
    }
    location / { try_files $uri $uri/ /index.html; }
}
# Plain-HTTP onboarding page for computers that do not have the Suro Client yet (no certificate to trust).
# It serves only /onboard: the page, a static script, the signed installer and a coarse status.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 1k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location ~ ^/onboard(/check\.js|/installer|/status)?$ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Suro-Client-Ip $remote_addr;
        proxy_buffering off;
    }
    location / { return 302 /onboard; }
}

